name: tests

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Compile
        run: python -m compileall -q .
      - name: Lint
        run: |
          pip install ruff
          ruff check . --select F,E9
